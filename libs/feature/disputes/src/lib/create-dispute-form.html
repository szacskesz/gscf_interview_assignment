<form [id]="$formId()" [formRoot]="$form" novalidate>
  <div class="space-y-4">
    <gscf-field-frame
      label="Buyer"
      [controlId]="$formId() + '-buyer'"
      [required]="true"
      [error]="$buyerError()"
    >
      <input
        gscfTextInput
        [id]="$formId() + '-buyer'"
        [formField]="$form.buyer!"
        placeholder="Enter buyer name"
        [readOnly]="$busy()"
        [attr.aria-invalid]="$buyerError() ? 'true' : null"
        [attr.aria-describedby]="$buyerError() ? $formId() + '-buyer-error' : null"
      />
    </gscf-field-frame>
    <gscf-field-frame
      label="Dispute Reason"
      [controlId]="$formId() + '-reason'"
      [required]="true"
      [error]="$reasonError()"
    >
      <input
        gscfTextInput
        [id]="$formId() + '-reason'"
        [formField]="$form.reason!"
        placeholder="Add a reason"
        [readOnly]="$busy()"
        [attr.aria-invalid]="$reasonError() ? 'true' : null"
        [attr.aria-describedby]="$reasonError() ? $formId() + '-reason-error' : null"
      />
    </gscf-field-frame>
    <gscf-field-frame
      label="Dispute Amount"
      [controlId]="$formId() + '-amount'"
      [required]="true"
      [error]="$amountError()"
    >
      <gscf-amount-field
        [controlId]="$formId() + '-amount'"
        [formField]="$form.amountInput"
        [locked]="$busy()"
        [showError]="$amountError() !== null"
      />
    </gscf-field-frame>
    <gscf-field-frame
      label="Currency"
      [controlId]="$formId() + '-currency'"
      kind="group"
      [disabled]="$busy()"
      [required]="true"
      [error]="$currencyError()"
    >
      <div class="flex flex-wrap gap-4">
        <label class="inline-flex min-h-11 cursor-pointer items-center gap-2">
          <input
            gscfRadioInput
            type="radio"
            value="USD"
            [formField]="$form.currencyInput"
            [attr.aria-invalid]="$currencyError() ? 'true' : null"
          />
          USD
        </label>
        <label class="inline-flex min-h-11 cursor-pointer items-center gap-2">
          <input
            gscfRadioInput
            type="radio"
            value="EUR"
            [formField]="$form.currencyInput"
            [attr.aria-invalid]="$currencyError() ? 'true' : null"
          />
          EUR
        </label>
      </div>
    </gscf-field-frame>
  </div>
</form>
