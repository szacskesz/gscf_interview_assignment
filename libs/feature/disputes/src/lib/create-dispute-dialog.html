<gscf-dialog-frame
  heading="Create a dispute"
  headingId="create-dispute-title"
  [busy]="$busy()"
  (closed)="dismiss()"
>
  <p id="create-dispute-description" class="mb-5 text-sm">
    Raise a dispute when an invoice differs from the agreed terms and conditions. Fields marked with
    * are mandatory.
  </p>
  <gscf-create-dispute-form [formId]="formId" [busy]="$busy()" (submitted)="save($event)" />
  @if ($failure(); as error) {
    <p role="alert" class="mt-4 text-sm text-danger">{{ error }}</p>
  }
  <footer dialogActions class="flex flex-wrap items-center justify-end gap-3 pt-3">
    @if ($busy()) {
      <p role="status" class="mr-auto text-sm">Creating dispute…</p>
    }
    <button type="button" gscfButton="secondary" [disabled]="$busy()" (click)="dismiss()">
      Cancel
    </button>
    <button
      type="submit"
      [attr.form]="formId"
      gscfButton="primary"
      [attr.aria-disabled]="$busy() || null"
    >
      Create Dispute
    </button>
  </footer>
</gscf-dialog-frame>
